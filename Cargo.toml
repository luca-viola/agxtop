[package]
name = "agxtop"
version = "0.1.0"
edition = "2024"
description = "nvtop-style GPU monitor for Asahi Linux (Apple Silicon)"
license = "GPL-3.0-or-later"
repository = "https://github.com/luca-viola/agxtop"

[dependencies]
crossterm = "0.29.0"
libc = "0.2.191"
ratatui = "0.30.2"
regex = "1.13.2"
signal-hook = "0.4.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
